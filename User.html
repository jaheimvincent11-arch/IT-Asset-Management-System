<div class="container">

    <!-- Header -->

        <h1>User Management</h1>
        <p>Manage system users and roles</p>
    </div>
     <!-- Navigation Bar -->
<nav class="navbar">
    <div class="logo">
        <i class="fas fa-laptop-code"></i>
        <span>IT Asset Manager</span>
    </div>

    <ul class="nav-links">
        <li>
            <a href="assets.html" class="active">
                <i class="fas fa-boxes"></i>

        <li>
            <a href="categories.html">
                <i class="fas fa-layer-group"></i>
                <span>Categories</span>
            </a>
        </li>

        <li>
            <a href="User.html">
                <i class="fas fa-users"></i>
                <span>Users</span>

        <li>

    </div>

    <!-- Add User Form -->
    <div class="card">

        <h3>Add New User</h3>

        <form id="userForm">
            <input id="fullName" type="text" placeholder="Full Name" required>
            <input id="username" type="text" placeholder="Username" required>
            <input id="email" type="email" placeholder="Email" required>
            <input id="password" type="password" placeholder="Password" required>

            <select id="role">
                <option value="">Role</option>
                <option value="Admin">Admin</option>
                <option value="Staff">Staff</option>
            </select>

            <button id="saveButton" class="btn" type="submit">Add User</button>
        </form>

    </div>

    <!-- Summary Cards -->
    <div class="cards">

        <div class="card">
            <h2 id="totalUsersCount">0</h2>
            <p>Total Users</p>
        </div>

        <div class="card">
            <h2 id="adminUsersCount">0</h2>
            <p>Admins</p>
        </div>

        <div class="card">
            <h2 id="staffUsersCount">0</h2>
            <p>Staff</p>
        </div>

    </div>

    <!-- Users Table -->
    <div class="card">

        <h3>All Users</h3>

        <table>
            <thead>
                <tr>
                    <th>User ID</th>
                    <th>Full Name</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="usersTableBody"></tbody>
        </table>

    </div>
