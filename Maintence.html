    <!-- Header -->

        <h1>Maintenance Management</h1>
        <p>Track repairs and IT equipment issues</p>
    </div>
     <!-- Navigation Bar -->
<nav class="navbar">

        <i class="fas fa-laptop-code"></i>

            <a href="Report.html">
                <i class="fas fa-chart-bar"></i>
                <span>Reports</span>

    <!-- Add Maintenance Form -->
    <div class="card">

        <h3>Log Maintenance Issue</h3>

        <form id="maintenanceForm">

            <input type="hidden" id="maintenanceId" value="">

            <label>Asset</label>
            <input type="text" id="asset" placeholder="Asset Name">

            <label>Issue Description</label>
            <input type="text" id="description" placeholder="Issue Description">

            <label>Technician Name</label>
            <input type="text" id="technician" placeholder="Technician Name">

            <label>Status</label>
            <select id="status">
                <option value="">Status</option>
                <option>Pending</option>
                <option>In Progress</option>
                <option>Completed</option>
            </select>

            <label>Completion Date</label>
            <input type="date" id="completionDate">

            <button class="btn" type="submit">Save Record</button>

        </form>

    </div>

    <!-- Summary Cards -->
    <div class="cards">

        <div class="card">
            <h2 id="pendingCount">0</h2>
            <p>Pending</p>
        </div>

        <div class="card">
            <h2 id="inProgressCount">0</h2>
            <p>In Progress</p>
        </div>

        <div class="card">
            <h2 id="completedCount">0</h2>
            <p>Completed</p>
        </div>

    </div>

    <!-- Maintenance Table -->
    <div class="card">

        <h3>Maintenance Records</h3>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Asset</th>
                    <th>Issue</th>
                    <th>Technician</th>
                    <th>Status</th>
                    <th>Completion Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="maintenanceTableBody"></tbody>
        </table>

    </div>
